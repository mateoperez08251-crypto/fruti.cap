name: Studio checks

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: studio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frutinovelas-studio
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frutinovelas-studio/frontend/package-lock.json
      - name: Install Python dependencies
        run: |
          python -m pip install uv
          uv sync --extra dev --frozen
      - name: Test API, workers, MCP and updater without GPU
        run: uv run --frozen pytest -q
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Test frontend behavior
        run: npm --prefix frontend test
      - name: Check and build frontend
        run: |
          npm --prefix frontend run lint
          npm --prefix frontend run build
